<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture scan | MoveIt</title>
    <link rel="icon" href="/landing/img/favicon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="/landing/css/style.css">
    <style>
        .phone-scan { width: min(100% - 2rem, 44rem); margin: 1.5rem auto 3rem; }
        .phone-scan .moveit-brand { color: var(--navy); display: inline-block; margin-bottom: 1.25rem; }
        .phone-scan h1 { color: var(--navy); font-weight: 900; }
        .camera-stage { position: relative; overflow: hidden; border-radius: var(--r); background: var(--navy); margin: 1.2rem 0; }
        .camera-stage video { display: block; width: 100%; min-height: 12rem; }
        .camera-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        .scan-actions { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; margin-bottom: .75rem; }
        .scan-actions .btn { min-height: 44px; }
        .scan-actions button:disabled { opacity: .5; cursor: default; }
    </style>
</head>
<body>
    <main class="phone-scan">
        <span class="moveit-brand" aria-label="MoveIt">MOVE<span>IT</span></span>
        <section class="panel" aria-labelledby="scan-title">
            <h1 id="scan-title">Furniture scan</h1>
            <p class="muted">Point your camera at each item. Review quantities in your MoveIt booking.</p>
            <div class="camera-stage">
                <video id="video" autoplay playsinline muted aria-label="Furniture camera preview"></video>
                <canvas id="overlay" aria-hidden="true"></canvas>
            </div>
            <div class="scan-actions">
                <button class="btn btn-primary" id="start" type="button">Start Camera</button>
                <button class="btn btn-outline" id="stop" type="button" disabled>Stop Camera</button>
                <a class="btn btn-outline" id="back-to-booking" hidden>Back to booking</a>
            </div>
            <p id="status" class="muted" role="status">Ready to start</p>
        </section>
    </main>
    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const frame = document.createElement('canvas');
        const frameCtx = frame.getContext('2d');
        const status = document.getElementById('status');
        const startButton = document.getElementById('start');
        const stopButton = document.getElementById('stop');
        const back = document.getElementById('back-to-booking');
        const params = new URLSearchParams(location.hash.slice(1));
        const booking = params.has('token') ? params.get('booking') : sessionStorage.getItem('moveit-scanner-booking');
        if (/^[0-9]+$/.test(booking ?? '')) {
            back.href = `/bookings/${booking}/scan`;
            back.hidden = false;
        }

        let socket = null;
        let stream = null;
        let running = false;
        let retryTimer;
        let responseTimer;
        let retries = 0;

        stopButton.disabled = true;

        async function scannerToken() {
            const pairingToken = params.get('token');
            if (!pairingToken) {
                const saved = sessionStorage.getItem('moveit-scanner-device');
                if (saved) return saved;
                throw new Error('Scan the QR code from your booking first.');
            }

            const response = await fetch('/api/scanner/pair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ pairing_token: pairingToken }),
            });
            if (!response.ok) throw new Error('This QR code could not be paired. Generate a new code in your booking.');
            const data = await response.json();
            sessionStorage.setItem('moveit-scanner-device', data.device_token);
            if (booking) sessionStorage.setItem('moveit-scanner-booking', booking);
            else sessionStorage.removeItem('moveit-scanner-booking');
            params.delete('token');
            history.replaceState(null, '', location.pathname + location.search);
            return data.device_token;
        }

        startButton.onclick = async () => {
            if (running) return;

            running = true;
            startButton.disabled = true;

            try {
                if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
                    throw new Error('Open the scanner QR link over HTTPS to use the phone camera.');
                }

                status.textContent = 'Starting camera...';

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: { ideal: 'environment' }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                status.textContent = 'Pairing scanner...';
                const deviceToken = await scannerToken();

                frame.width = Math.min(480, video.videoWidth);
                frame.height = Math.max(
                    1, Math.round(frame.width * video.videoHeight / video.videoWidth)
                );
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;

                stopButton.disabled = false;

                status.textContent = 'Camera ready. Connecting to AI...';

                retries = 0;
                connect(deviceToken);
            } catch (error) {
                stopCamera();
                console.error(error);
                status.textContent = error.message;
            }
        };

        function connect(deviceToken) {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const currentSocket = new WebSocket(
                `${protocol}//${location.host}/ws/detect`, ['moveit.scan', `token.${deviceToken}`]
            );
            socket = currentSocket;
            waitForResponse(currentSocket);

            currentSocket.onopen = () => {
                if (socket !== currentSocket || !running) return;

                status.textContent = 'Connected to AI';
                sendFrame();
            };

            currentSocket.onmessage = (event) => {
                if (!running || socket !== currentSocket) return;

                const data = JSON.parse(event.data);
                clearTimeout(responseTimer);
                retries = 0;

                if (data.error) {
                    console.error(data.error);
                    requestAnimationFrame(sendFrame);
                    return;
                }

                const detections = data.detections || [];
                const pendingDetections = data.pending_detections || [];
                drawDetections(detections, pendingDetections);
                status.textContent = pendingDetections.length && !detections.length
                    ? 'Finding a stable match? Hold the camera steady.'
                    : 'Scanning. Review results in your MoveIt booking.';

                requestAnimationFrame(sendFrame);
            };

            currentSocket.onclose = (event) => {
                if (!running || socket !== currentSocket) return;
                clearTimeout(responseTimer);
                socket = null;
                if (event.code === 1008 || retries >= 3) {
                    stopCamera();
                    status.textContent = event.code === 1008
                        ? 'Scan session ended. Open a new scan from your booking.'
                        : 'AI connection interrupted. Tap Start to try again.';
                    return;
                }
                status.textContent = 'Reconnecting to AI...';
                retryTimer = setTimeout(() => connect(deviceToken), 1000 * ++retries);
            };
        }

        function waitForResponse(currentSocket) {
            clearTimeout(responseTimer);
            responseTimer = setTimeout(() => {
                if (socket === currentSocket) currentSocket.close();
            }, 30000);
        }

        function sendFrame() {
            if (!running || socket?.readyState !== WebSocket.OPEN) {
                return;
            }

            frameCtx.drawImage(
                video, 0, 0, frame.width, frame.height
            );

            const currentSocket = socket;

            frame.toBlob(blob => {
                if (
                    running &&
                    socket === currentSocket &&
                    currentSocket.readyState === WebSocket.OPEN
                ) {
                    if (!blob) {
                        requestAnimationFrame(sendFrame);
                        return;
                    }
                    waitForResponse(currentSocket);
                    currentSocket.send(blob);
                }
            }, 'image/jpeg', 0.55);
        }

        function drawDetections(detections, pendingDetections) {
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const scaleX = overlay.width / frame.width;
            const scaleY = overlay.height / frame.height;

            [...pendingDetections, ...detections].forEach(item => {
                const [x1, y1, x2, y2] = item.bbox;
                const x = x1 * scaleX;
                const y = y1 * scaleY;

                const pending = item.object_id == null;
                const color = pending ? '#ffcf4a' : '#00ff00';
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;

                ctx.strokeRect(x, y, (x2 - x1) * scaleX, (y2 - y1) * scaleY);

                ctx.fillStyle = color;
                ctx.font = '18px Arial';


                ctx.fillText(
                    item.display_label || item.label,
                    x,
                    Math.max(20, y - 8)
                );
            });
        }

        function stopCamera() {
            running = false;
            clearTimeout(retryTimer);
            clearTimeout(responseTimer);

            if (socket) {
                const oldSocket = socket;
                socket = null;
                oldSocket.close();
            }

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;

            ctx.clearRect(0, 0, overlay.width, overlay.height);

            startButton.disabled = false;
            stopButton.disabled = true;

            status.textContent = 'Camera stopped';
        }

        stopButton.onclick = stopCamera;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Furniture Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }
        .scanner {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }
        video {
            display: block;
            width: 640px;
            max-width: 100%;
            border-radius: 10px;
        }
        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
        }
        button {
            padding: 12px 20px;
            cursor: pointer;
            margin: 5px;
        }
        .inventory {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: left;
        }
        .inventory ul {
            padding: 0;
        }
        .inventory li {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            list-style: none;
        }
        .review-quantity {
            box-sizing: border-box;
            width: 5rem;
            min-height: 44px;
            margin-left: 1rem;
            font: inherit;
        }
    </style>
</head>
<body>
    <h1>AI Furniture Scanner</h1>

    <button id="start">Start Camera</button>
    <button id="stop">Stop Camera</button>

    <p id="status">Disconnected</p>

    <div class="scanner">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <div class="inventory">
        <p>Visible objects: <strong id="visible-items">0</strong></p>
        <h2>Session inventory</h2>
        <ul id="inventory-list"></ul>
        <h3>Total Items: <span id="total-items">0</span></h3>
        <form id="review-form" hidden>
            <h2>Review quantities</h2>
            <ul id="review-list"></ul>
            <button type="submit">Confirm inventory</button>
        </form>
        <section id="confirmed-inventory" hidden>
            <h2>Confirmed inventory</h2>
            <ul id="confirmed-list"></ul>
            <p>Total confirmed: <strong id="confirmed-total">0</strong></p>
        </section>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const frame = document.createElement('canvas');
        const frameCtx = frame.getContext('2d');
        const status = document.getElementById('status');
        const startButton = document.getElementById('start');
        const stopButton = document.getElementById('stop');
        const inventoryList = document.getElementById('inventory-list');
        const totalItems = document.getElementById('total-items');
        const visibleItems = document.getElementById('visible-items');
        const reviewForm = document.getElementById('review-form');
        const reviewList = document.getElementById('review-list');
        const confirmedInventory = document.getElementById('confirmed-inventory');
        const confirmedList = document.getElementById('confirmed-list');
        const confirmedTotal = document.getElementById('confirmed-total');

        let socket = null;
        let stream = null;
        let running = false;
        let sessionInventory = null;

        stopButton.disabled = true;

        startButton.onclick = async () => {
            if (running) return;

            running = true;
            startButton.disabled = true;

            try {
                status.textContent = 'Starting camera...';

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: { ideal: 'environment' }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                frame.width = Math.min(480, video.videoWidth);
                frame.height = Math.max(
                    1, Math.round(frame.width * video.videoHeight / video.videoWidth)
                );
                overlay.width = video.videoWidth;
                overlay.height = video.videoHeight;

                stopButton.disabled = false;

                status.textContent = 'Camera ready. Connecting to AI...';

                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

                socket = new WebSocket(
                    `${protocol}//${location.host}/ws/detect`
                );

                const currentSocket = socket;

                socket.onopen = () => {
                    if (socket !== currentSocket || !running) return;

                    status.textContent = 'Connected to AI';
                    sessionInventory = null;
                    reviewForm.hidden = true;
                    confirmedInventory.hidden = true;
                    updateInventory({}, 0);
                    sendFrame();
                };

                socket.onmessage = (event) => {
                    if (!running || socket !== currentSocket) return;

                    const data = JSON.parse(event.data);

                    if (data.error) {
                        console.error(data.error);
                        requestAnimationFrame(sendFrame);
                        return;
                    }

                    const detections = data.detections || [];
                    const pendingDetections = data.pending_detections || [];
                    visibleItems.textContent = detections.length + pendingDetections.length;
                    drawDetections(detections, pendingDetections);

                    sessionInventory = data.inventory || {};
                    updateInventory(sessionInventory, data.total_items || 0);

                    requestAnimationFrame(sendFrame);
                };

                socket.onerror = (error) => {
                    if (socket !== currentSocket) return;

                    console.error('WebSocket error:', error);
                    stopCamera();
                    status.textContent = 'AI connection failed';
                };

                socket.onclose = () => {
                    if (socket !== currentSocket) return;

                    stopCamera();
                    status.textContent = 'AI disconnected';
                };

            } catch (error) {
                stopCamera();
                console.error(error);
                status.textContent = error.message;
            }
        };

        function sendFrame() {
            if (!running || socket?.readyState !== WebSocket.OPEN) {
                return;
            }

            frameCtx.drawImage(
                video, 0, 0, frame.width, frame.height
            );

            const currentSocket = socket;

            frame.toBlob(blob => {
                if (
                    blob &&
                    running &&
                    socket === currentSocket &&
                    currentSocket.readyState === WebSocket.OPEN
                ) {
                    currentSocket.send(blob);
                }
            }, 'image/jpeg', 0.55);
        }

        function drawDetections(detections, pendingDetections) {
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const scaleX = overlay.width / frame.width;
            const scaleY = overlay.height / frame.height;

            [...pendingDetections, ...detections].forEach(item => {
                const [x1, y1, x2, y2] = item.bbox;
                const x = x1 * scaleX;
                const y = y1 * scaleY;

                const pending = item.object_id == null;
                const color = pending ? '#ffcf4a' : '#00ff00';
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;

                ctx.strokeRect(x, y, (x2 - x1) * scaleX, (y2 - y1) * scaleY);

                ctx.fillStyle = color;
                ctx.font = '18px Arial';

                const confidence = Math.round(item.confidence * 100);
                const identity = pending ? 'pending' : `#${item.object_id}`;

                ctx.fillText(
                    `${item.label} ${identity} ${confidence}%`,
                    x,
                    Math.max(20, y - 8)
                );
            });
        }

        function updateInventory(inventory, total) {
            renderInventory(inventoryList, Object.entries(inventory));
            totalItems.textContent = total;
        }

        function renderInventory(list, entries) {
            list.replaceChildren();
            entries.forEach(([label, quantity]) => {
                const li = document.createElement('li');
                li.textContent = `${label}: ${quantity}`;
                list.appendChild(li);
            });
        }

        function showReview() {
            if (sessionInventory === null || !confirmedInventory.hidden || !reviewForm.hidden) return;

            reviewList.replaceChildren();
            for (const [label, quantity] of Object.entries(sessionInventory)) {
                const row = document.createElement('li');
                const fieldLabel = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'number';
                input.name = label;
                input.min = '0';
                input.max = String(Number.MAX_SAFE_INTEGER);
                input.step = '1';
                input.required = true;
                input.value = quantity;
                input.className = 'review-quantity';
                fieldLabel.append(label, input);
                row.appendChild(fieldLabel);
                reviewList.appendChild(row);
            }
            reviewForm.hidden = false;
        }

        reviewForm.onsubmit = (event) => {
            event.preventDefault();
            const entries = [...new FormData(reviewForm)]
                .map(([label, quantity]) => [label, Number(quantity)])
                .filter(([, quantity]) => quantity > 0);
            renderInventory(confirmedList, entries);
            confirmedTotal.textContent = entries.reduce((total, [, quantity]) => total + quantity, 0);
            confirmedInventory.hidden = false;
            reviewForm.hidden = true;
        };

        function stopCamera() {
            running = false;

            if (socket) {
                const oldSocket = socket;
                socket = null;
                oldSocket.close();
            }

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;

            ctx.clearRect(0, 0, overlay.width, overlay.height);
            visibleItems.textContent = '0';
            showReview();

            startButton.disabled = false;
            stopButton.disabled = true;

            status.textContent = 'Camera stopped';
        }

        stopButton.onclick = stopCamera;
    </script>
</body>
</html>
